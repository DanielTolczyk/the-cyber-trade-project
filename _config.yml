title: The Cybersecurity Trade Project
description: Restructuring cybersecurity into a recognized skilled trade through apprenticeships, licensure, and underwriter accountability.
version: "v1.9.7"
baseurl: "/framework"
url: "https://the-cyber-trade-project.github.io"
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

include:
