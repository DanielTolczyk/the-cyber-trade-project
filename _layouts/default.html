<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }} - Restructuring Cybersecurity into a Skilled Trade{% endif %}</title>
  <meta name="description" content="{{ site.description }}">
  
  <!-- Defensive Security & Content Protection Directives -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self';">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), interest-cohort=()">

  <!-- Open Graph & Social Preview Metadata -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="The Cybersecurity Trade Project">
  <meta property="og:title" content="{% if page.title and page.title != site.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:url" content="https://the-cyber-trade-project.github.io/framework/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% if page.title and page.title != site.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}">
  <meta name="twitter:description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/tokens.css?v={{ site.time | date: '%s' }}">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/portal.css?v={{ site.time | date: '%s' }}">
</head>
<body>
  <a href="#main-content" class="skip-to-content">Skip to main content</a>
  {% include header.html %}

  <div class="portal-sidebar-backdrop" id="portal-sidebar-backdrop"></div>

  <div class="portal-layout">
    {% include sidebar.html %}

    <main class="portal-main" id="main-content" tabindex="-1">
      <article class="portal-article">
        {{ content }}
      </article>
    </main>
  </div>

  {% include footer.html %}

  <script src="{{ site.baseurl }}/assets/js/portal.js?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
